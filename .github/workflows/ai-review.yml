# Reviews every pull request in this repo with the action defined in action.yml.
# Add a GEMINI_API_KEY repository secret for real reviews; without it the action
# runs in demo mode. `pull_request` (not `pull_request_target`) means PRs from
# forks never see your secrets.
name: ai-review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          max-comments: "8"
